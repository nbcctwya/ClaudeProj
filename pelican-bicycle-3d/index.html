<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D 鹈鹕骑自行车</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="panel">
    <h1>🚲 鹈鹕骑自行车</h1>
    <label>
      速度
      <input id="speed" type="range" min="0" max="3" step="0.05" value="1" />
      <span id="speedValue">1.00×</span>
    </label>
    <div class="buttons">
      <button id="pause">暂停</button>
      <button id="follow" class="active">跟随镜头</button>
      <button id="bell">🔔 按铃</button>
    </div>
    <p class="hint">拖动旋转视角 · 滚轮缩放 · 右键平移 · 空格暂停</p>
  </div>

  <div id="error" hidden>
    无法加载 three.js（需要联网访问 cdn.jsdelivr.net）。
  </div>

  <script type="module" src="main.js"></script>
  <script>
    // 如果模块在几秒内没有启动（比如 CDN 无法访问），显示提示
    setTimeout(() => {
      if (!window.__pelicanStarted) document.getElementById('error').hidden = false;
    }, 6000);
  </script>
</body>
</html>
