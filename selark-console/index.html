<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Selark Console · 本地 AI 资源控制台">
  <title>Selark Console</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><span class="aurora a1"></span><span class="aurora a2"></span><span class="aurora a3"></span><span class="grid"></span></div>
  <a class="skip-link" href="#main">跳至主内容</a>

  <aside class="sidebar" aria-label="侧边栏">
    <a class="brand" href="./" aria-label="Selark Console 首页">
      <img src="assets/mark.svg" width="38" height="38" alt="">
      <span class="brand-text"><b>Selark</b><small>CONSOLE · 本地 AI 资源</small></span>
    </a>

    <nav class="nav" aria-label="主导航">
      <p class="nav-label">工作空间</p>
      <button class="nav-item active" data-view="overview" aria-current="page"><span data-icon="overview"></span><span>资源概览</span><kbd>1</kbd></button>
      <button class="nav-item" data-view="resources"><span data-icon="resources"></span><span>连接与模型</span><kbd>2</kbd></button>
      <button class="nav-item" data-view="usage"><span data-icon="chart"></span><span>用量分析</span><kbd>3</kbd></button>
      <button class="nav-item" data-view="applications"><span data-icon="apps"></span><span>应用管理</span><kbd>4</kbd></button>
      <button class="nav-item" data-view="monitor"><span data-icon="pulse"></span><span>运行监控</span><kbd>5</kbd></button>
    </nav>

    <div class="sidebar-gateway" id="sidebar-gateway">
      <div class="gw-head"><span class="pulse-dot" id="gw-dot"></span><span>本机网关</span><span class="gw-state" id="gw-state">—</span></div>
      <div class="gw-bars"><div><small>执行</small><span class="gw-bar"><i id="gw-active"></i></span><b id="gw-active-n">—</b></div><div><small>排队</small><span class="gw-bar queued"><i id="gw-queued"></i></span><b id="gw-queued-n">—</b></div></div>
    </div>

    <div class="sidebar-bottom">
      <div class="local-card"><span data-icon="shield"></span><div><strong>数据留在本机</strong><p id="access-mode">127.0.0.1 · 独立管理会话</p></div></div>
      <div class="sidebar-footer"><span>Console <b>1.0</b></span><span id="version">Selark</span></div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="crumbs"><span class="crumb-root">工作空间</span><span class="crumb-sep">/</span><strong id="breadcrumb">资源概览</strong></div>
      <button class="search-trigger" id="open-palette" aria-label="打开命令面板"><span data-icon="search"></span><span>搜索连接、应用或命令</span><kbd>⌘K</kbd></button>
      <div class="topbar-right">
        <span class="mode-pill" id="mode-pill"><span id="mode-icon" data-icon="lock"></span><span id="dashboard-mode">本机管理</span></span>
        <button class="icon-button" id="theme" aria-label="切换主题" title="切换主题"><span data-icon="sun" id="theme-icon"></span></button>
        <button class="icon-button" id="refresh" aria-label="刷新数据" title="刷新 (R)"><span data-icon="refresh"></span></button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div class="page-heading">
        <div>
          <p class="eyebrow" id="eyebrow">YOUR AI, AT A GLANCE</p>
          <h1 id="page-title">资源概览</h1>
          <p class="page-description" id="page-description">连接、用量与运行状态，都在这里。</p>
        </div>
        <div class="freshness"><span class="fresh-dot" id="fresh-dot"></span><span id="freshness" role="status">等待本地数据</span></div>
      </div>

      <div id="notice" class="notice" role="status" hidden></div>

      <section id="filters" class="filterbar" aria-label="用量与调用记录筛选" hidden>
        <div class="period-switch" role="group" aria-label="时间范围">
          <button data-period="24h">24 小时</button><button data-period="7d" class="active">7 天</button><button data-period="30d">30 天</button><button data-period="90d">90 天</button><button data-period="custom">自定义</button>
        </div>
        <label class="select"><span>应用</span><select id="caller_id" aria-label="筛选应用"><option value="">全部应用</option></select></label>
        <label class="select"><span>连接</span><select id="connection_id" aria-label="筛选连接"><option value="">全部连接</option></select></label>
        <label class="select"><span>模型</span><select id="model" aria-label="筛选模型"><option value="">全部模型</option></select></label>
        <button id="reset-filters" class="ghost-button">重置</button>
        <div id="custom-range" class="custom-range" hidden>
          <label>开始 <input type="datetime-local" id="since" aria-label="开始时间"></label>
          <label>结束 <input type="datetime-local" id="until" aria-label="结束时间"></label>
          <button id="apply-range" class="primary-button">应用</button>
          <small>浏览器本地时区输入；结束时间不包含在内，最长 366 天。</small>
        </div>
      </section>

      <div id="content" aria-live="polite">
        <div class="loading"><span class="loader"><i></i><i></i><i></i></span><h2>正在读取本地工作空间</h2><p>从真实记录整理资源与用量。</p></div>
      </div>

      <footer class="main-footer"><span><span class="dot ok"></span>仅限本机 · 不探测供应商</span><span>历史记录有据可查，未知状态如实呈现。</span></footer>
    </main>
  </div>

  <nav class="tabbar" aria-label="移动端导航">
    <button data-view="overview" class="active"><span data-icon="overview"></span><small>概览</small></button>
    <button data-view="resources"><span data-icon="resources"></span><small>连接</small></button>
    <button data-view="usage"><span data-icon="chart"></span><small>用量</small></button>
    <button data-view="applications"><span data-icon="apps"></span><small>应用</small></button>
    <button data-view="monitor"><span data-icon="pulse"></span><small>监控</small></button>
  </nav>

  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
    <div class="drawer-head"><span class="eyebrow" id="drawer-kicker">DETAILS</span><button id="close-drawer" class="icon-button" aria-label="关闭详情"><span data-icon="close"></span></button></div>
    <div id="drawer-content"></div>
  </dialog>

  <dialog id="palette" class="palette" aria-label="命令面板">
    <div class="palette-input"><span data-icon="search"></span><input id="palette-input" type="text" placeholder="跳转页面、查找连接或应用…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
    <div id="palette-list" class="palette-list" role="listbox"></div>
  </dialog>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
