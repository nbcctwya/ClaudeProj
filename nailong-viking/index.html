<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f2440">
<title>奶龙维京突击</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hudBtns">
    <button id="pauseBtn" class="round" title="暂停 (P)">❚❚</button>
    <button id="muteBtn" class="round" title="声音 (M)">♪</button>
  </div>
  <button id="bombBtn" title="龙吼 (空格 / X / 双击)"><span>龙吼</span></button>

  <section id="title" class="overlay show">
    <div class="card">
      <div class="badge">NAILONG VIKING STRIKE</div>
      <h1><span class="y">奶龙</span><span class="dot">·</span><span class="o">维京突击</span></h1>
      <p class="story">
        橘子群岛的<b>水豚噜噜</b>们泡完温泉，<br>
        开着橘子战机、澡盆战机、生菜轰炸机<br>
        来抢奶龙的奶啦！<br>
        戴上牛角头盔，驾驶<b>维京龙首战机</b>，出击！
      </p>
      <ul class="keys">
        <li><kbd>鼠标</kbd>/<kbd>拖动</kbd>/<kbd>WASD</kbd> 移动（自动射击）</li>
        <li><kbd>Shift</kbd> 精准慢速 · <kbd>空格</kbd>/<kbd>X</kbd>/双击 龙吼清屏</li>
        <li>接住跳伞的噜噜有奖励 · <kbd>P</kbd> 暂停 · <kbd>M</kbd> 静音</li>
      </ul>
      <div class="legend">
        <span><i class="pk p"></i>奶瓶·火力</span>
        <span><i class="pk s"></i>盾牌·护盾</span>
        <span><i class="pk b"></i>号角·龙吼</span>
        <span><i class="pk l"></i>奶龙·1UP</span>
      </div>
      <button class="big" id="startBtn">出击！</button>
      <div class="hi">最高分 <b id="hiTitle">0</b></div>
    </div>
  </section>

  <section id="over" class="overlay">
    <div class="card">
      <h2 id="overTitle">奶龙坠机了…</h2>
      <div class="stats">
        <div><small>得分</small><b id="oScore">0</b></div>
        <div><small>最高分</small><b id="oHi">0</b></div>
        <div><small>击落噜噜</small><b id="oKills">0</b></div>
        <div><small>接住噜噜</small><b id="oSaved">0</b></div>
        <div><small>到达关卡</small><b id="oStage">1</b></div>
        <div><small>最高连击</small><b id="oCombo">0</b></div>
      </div>
      <p class="quip" id="oQuip"></p>
      <button class="big" id="againBtn">再来一局</button>
    </div>
  </section>

  <section id="pause" class="overlay">
    <div class="card small">
      <h2>暂停中</h2>
      <p class="quip">噜噜们也趁机泡个澡～</p>
      <button class="big" id="resumeBtn">继续</button>
      <button class="ghost" id="quitBtn">回到标题</button>
    </div>
  </section>
</div>

<script src="sprites.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
